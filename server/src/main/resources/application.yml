# ============================================================
# PKB 个人知识库 · 后端公共配置
# 环境相关项一律走环境变量（.env / 系统环境变量），明文不入仓
# ============================================================
spring:
  application:
    name: pkb-server
  profiles:
    # 默认 dev；需要时可覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 可选导入 server/.env（文件不存在时静默跳过，靠各配置项的默认值兜底）
    import: optional:file:./.env[.properties]
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false
  servlet:
    # 上传上限：PKB 附件不限于图片（P-009），故放宽全局闸门；
    # 具体白名单与大小上限在 T11 方案中定（业务校验的文案更精确）
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    whitelabel:
      enabled: false

# 应用自有配置
pkb:
  app:
    version: @project.version@
  health:
    # 是否在 /health 里回显下游错误详情（自用本机环境可开启）
    expose-detail: true
  security:
    # 登录失败锁定：连续失败达到次数即锁定，锁定时长内不再校验密码
    login-max-fail: ${PKB_LOGIN_MAX_FAIL:5}
    login-lock-minutes: ${PKB_LOGIN_LOCK_MINUTES:15}
    # 图形验证码有效期（秒），校验通过后立即作废
    captcha-ttl-seconds: ${PKB_CAPTCHA_TTL:120}
    # 密码强度：长度区间 + 必须同时包含字母与数字（见 PasswordPolicy）
    password-min-length: ${PKB_PASSWORD_MIN_LENGTH:8}
    password-max-length: ${PKB_PASSWORD_MAX_LENGTH:20}
  # 对象存储：MinIO（P-009 附件，T11 启用）。凭据为空时应用照常启动，只是上传不可用
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:pkb}
    # 对象对外的公开地址前缀；留空则回退 endpoint/bucket。
    # 库表存的是对象 key，读接口现拼这个前缀 —— 换域名时旧附件不会失效
    public-url: ${MINIO_PUBLIC_URL:}

# 鉴权：Sa-Token（Header 模式，token 存 Redis，重启不掉线）
sa-token:
  token-name: ${SA_TOKEN_NAME:pkb-token}
  # token 有效期（秒），604800 = 7 天
  # ⚠️ 由 30 天缩短为 7 天（2026-10-15 拍板，PRD #16）：提高安全性，
  #    且强制周期性重登，降低「长期不登录而忘记密码」的概率
  timeout: ${SA_TOKEN_TIMEOUT:604800}
  # 临时活跃有效期：-1 表示不限制
  active-timeout: -1
  # ⚠️ **禁止多端登录**（2026-10-15 拍板，PRD #16）：false = 同一账号新登录会踢掉旧 token
  is-concurrent: false
  # 多端登录时不共用同一 token（is-concurrent=false 时该项不再起作用，保留以示意）
  is-share: false
  token-style: uuid
  # 只从 Header 读取 token，不用 Cookie
  is-read-cookie: false
  is-read-header: true
  is-log: false

# ORM：MyBatis-Plus（T2 起接入 Mapper）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 接口文档：默认全关，仅 dev 打开
knife4j:
  enable: false
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
